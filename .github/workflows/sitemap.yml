# Rebuilds sitemap.xml every day from Firestore's public data (tools/sitemap.py) and commits it if it changed, so new
# replays and MPs with new data get into it. Run it by hand from the Actions tab ("Run workflow") after a sitting.
# Firestore enforces App Check: the repository secret APP_CHECK_DEBUG_TOKEN is an App Check debug token of the site's
# web app (Firebase console → App Check → Apps → Manage debug tokens, "GitHub Actions sitemap"); the reads are still
# only what the security rules let any visitor read.
name: sitemap

on:
  schedule:
    - cron: "23 4 * * *"  # 04:23 UTC daily, after the evening's runs are published
  workflow_dispatch:

permissions:
  contents: write  # commit sitemap.xml
  checks: write    # the "Conventional commits" check on that commit (master's ruleset requires it)
  pages: write     # ask GitHub Pages to rebuild after that commit

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # each page's lastmod is its last commit

      - name: Rebuild sitemap.xml
        env:
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
        run: python3 tools/sitemap.py

      - name: Commit and publish if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unchanged"
            exit 0
          fi
          # Through the API, not git push: GitHub signs the commit (Verified), its author and committer are
          # github-actions[bot], never a person. Master's ruleset requires the "Conventional commits" check on every
          # commit it moves to, and only admins may skip it, so the commit is made first, its message checked the
          # way .github/workflows/commit-messages.yml checks a pull request's, the check recorded on it, and only
          # then master moved to it (a fast-forward: it fails rather than overwrite a newer commit).
          msg="chore(sitemap): refresh from Firestore"
          re="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ]"
          [[ "$msg" =~ $re ]] || { echo "::error::not a conventional commit message: $msg"; exit 1; }
          parent=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)
          base_tree=$(gh api "repos/$REPO/git/commits/$parent" --jq .tree.sha)
          blob=$(gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content="$(base64 -w0 sitemap.xml)" --jq .sha)
          tree=$(gh api "repos/$REPO/git/trees" -f base_tree="$base_tree" -f "tree[][path]=sitemap.xml" \
            -f "tree[][mode]=100644" -f "tree[][type]=blob" -f "tree[][sha]=$blob" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" -f message="$msg" -f tree="$tree" -f "parents[]=$parent" --jq .sha)
          gh api "repos/$REPO/check-runs" -f name="Conventional commits" -f head_sha="$commit" \
            -f status=completed -f conclusion=success \
            -f "output[title]=Conventional commit" -f "output[summary]=$msg" --silent
          gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" -F force=false --silent
          echo "${commit:0:7} $msg"
          # a commit made with the workflow's token may not start a Pages build by itself
          gh api -X POST "repos/$REPO/pages/builds" --silent
