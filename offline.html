<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nincs kapcsolat – Vitaradar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#040706">
  <!-- What sw.js shows when a page cannot load: no connection. Everything is in this file (the worker stores only it),
       so no font, script or picture is fetched. When it changes, raise VERSION in sw.js. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: #040706; color: #d5e0da;
      font: 400 15px/1.5 "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 360px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 28px; color: #3df082;
      font: 700 22px/1 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -.3px; }
    .brand svg { width: 38px; height: 22px; overflow: visible; }
    .brand .seat { fill: #3df082; }
    .brand .spk { fill: #ff5d52; }
    .tld { color: #8a9e94; }
    h1 { margin: 0 0 10px; color: #3df082; font: 700 20px/1.2 "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 1.2px; text-transform: uppercase; }
    p { margin: 0 0 22px; color: #8a9e94; }
    button { min-height: 44px; padding: 0 20px; border: 0; background: #3df082; color: #021108; cursor: pointer;
      font: 700 12px/1 "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.4px; text-transform: uppercase; }
    button:hover, button:focus-visible { background: #5df59a; }
    button:focus-visible { outline: 1px solid #3df082; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="vitaradar.hu">
      <svg viewBox="0 0 240 138" aria-hidden="true" focusable="false"><path class="seat" d="M4 16 A116 118 0 0 0 50 109.8 L68 81.5 A84 84 0 0 1 36 16 Z"/><path class="seat" d="M62 117.6 A116 118 0 0 0 178 117.6 L161 88.8 A84 84 0 0 1 79 88.8 Z"/><path class="seat" d="M236 16 A116 118 0 0 1 190 109.8 L172 81.5 A84 84 0 0 0 204 16 Z"/><path class="seat" d="M46 16 A74 74 0 0 0 73.4 72.8 L88.6 49.5 A45.8 45.8 0 0 1 74.2 16 Z"/><path class="seat" d="M84 80 A74 74 0 0 0 156 80 L142 56 A45.8 45.8 0 0 1 98 56 Z"/><path class="seat" d="M194 16 A74 74 0 0 1 166.6 72.8 L151.4 49.5 A45.8 45.8 0 0 0 165.8 16 Z"/><circle class="spk" cx="120" cy="18.5" r="15.2"/></svg>
      <span>vitaradar<span class="tld">.hu</span></span>
    </div>
    <h1>Nincs internetkapcsolat</h1>
    <p role="status">Az élő adáshoz és a tényellenőrzésekhez internet kell. Amint visszajön a kapcsolat, az oldal magától betöltődik.</p>
    <button type="button" id="retry">Újrapróbálom</button>
  </main>
  <script>
    // the page the reader asked for (this one stands in for it at its own address): again, by hand or once back online
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
